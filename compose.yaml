services:
  api:
    image: wonder-pocket-api:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_PATH: /app/data/pocket.sqlite
      SERVE_STATIC: "false"
    ports:
      - "${POCKET_API_PORT:-3001}:3001"
    volumes:
      - pocket-data:/app/data
    stop_grace_period: 20s

volumes:
  pocket-data:
